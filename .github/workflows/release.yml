
name: Build Windows Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked -p client

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/client.exe
          generate_release_notes: true
